<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>駅名クイズ</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2330;--sub:#667085;--line:#d9dee7;--acc:#1f7a4d;--ok:#1f9d5b;--ng:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--text:#eef1f5;--sub:#9aa4b2;--line:#2c3441;--acc:#4cc38a;--ok:#4cc38a;--ng:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--text:#eef1f5;--sub:#9aa4b2;--line:#2c3441;--acc:#4cc38a;--ok:#4cc38a;--ng:#ff7b7b;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 12px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
button,input{font:inherit;color:inherit}
.btn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;margin-bottom:8px;cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.row{display:flex;justify-content:space-between;color:var(--sub);font-size:14px}
.linebadge{display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid var(--acc);color:var(--acc);font-weight:600;font-size:15px}
.hint{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}
.st{padding:10px 14px;border-radius:10px;border:2px solid var(--acc);font-size:19px;font-weight:600}
.q{padding:10px 18px;border-radius:10px;background:var(--line);font-size:19px;font-weight:700}
.bar{color:var(--sub);font-size:20px}
input[type=text]{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:18px;margin-bottom:8px}
.msg{text-align:center;min-height:48px;font-weight:600;margin:4px 0 8px;line-height:1.6}
.hidden{display:none}
.two{display:flex;gap:8px}
#info{font-size:14px;color:var(--sub);margin:0 0 12px}
.lrow{border-bottom:1px solid var(--line);padding:8px 0;line-height:1.5}
.lh{color:var(--sub);font-size:12px}.lq{font-weight:600;font-size:15px}.la{color:var(--acc);font-weight:700;font-size:15px}
select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;margin-bottom:8px}
.pager{display:flex;gap:8px;align-items:center;margin:8px 0}.pager .btn{margin:0;padding:10px}.pager span{flex:2;text-align:center;color:var(--sub);font-size:13px}
.range{margin:0 0 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.range summary{cursor:pointer;font-size:14px}
.rtop,.rrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.rname{font-weight:700;border-color:var(--acc);color:var(--acc)}
.prev{font-size:13px;padding:8px 10px;border-radius:10px;margin-bottom:12px;line-height:1.5}
.prev.ok{background:rgba(31,157,91,.14);color:var(--ok)}
.prev.ng{background:rgba(214,69,69,.14);color:var(--ng)}
.hint.branch{position:relative;flex-wrap:nowrap;gap:0;justify-content:center}
.bcol{display:flex;flex-direction:column;gap:12px;min-width:0;max-width:32%}
.bcol.l{align-items:flex-end;margin-right:28px}.bcol.r{align-items:flex-start;margin-left:28px}
.hint.branch .st{font-size:15px;padding:8px 10px;line-height:1.35;word-break:break-all}
.hint.branch .q{flex:none}
.bsvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bsvg line{stroke:var(--acc);stroke-width:3;stroke-linecap:round}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.modes .btn{margin:0}
.big{font-size:44px;font-weight:700;text-align:center;margin:8px 0}
.rrate{text-align:center;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main>
<section id="start">
  <h1>駅名クイズ</h1>
  <p class="sub">路線名と両隣の駅をヒントに、まん中の駅名を入力して当てよう。</p>
  <div class="card">
    <div id="info"></div>
    <details class="range" id="range"><summary id="rangeSum"></summary><div id="rangeBody"></div></details>
    <div class="modes">
      <button class="btn primary modebtn" data-n="5">5問モード</button>
      <button class="btn primary modebtn" data-n="10">10問モード</button>
      <button class="btn primary modebtn" data-n="15">15問モード</button>
      <button class="btn primary modebtn" data-n="0">エンドレスモード</button>
    </div>
    <button class="btn" id="dbg">問題一覧</button>
  </div>
  <p class="sub" style="text-align:center">駅・路線データ: <a href="https://ekidata.jp/" target="_blank" rel="noopener" style="color:var(--acc)">駅データ.jp</a></p>
</section>
<section id="play" class="hidden">
  <div class="row"><span id="stat"></span><span id="streak"></span></div>
  <div class="card">
    <div id="prev" class="prev hidden"></div>
    <div style="text-align:center"><span class="linebadge" id="lineName"></span></div>
    <div class="hint" id="hint"></div>
    <div class="msg" id="msg"></div>
    <input type="text" id="ans" placeholder="駅名を入力" autocomplete="off" autocapitalize="off" enterkeyhint="done">
    <div id="ansBtns" class="two"><button class="btn primary" id="submit">答える</button><button class="btn" id="pass">わからない</button></div>
    <button class="btn primary hidden" id="next">次の問題</button>
    <button class="btn" id="quit">やめる</button>
  </div>
</section>
<section id="result" class="hidden">
  <div class="card">
    <div class="sub" id="rmode" style="text-align:center;margin:0"></div>
    <div class="big" id="rscore"></div>
    <div class="rrate" id="rrate"></div>
    <div class="msg" id="rcomment" style="min-height:24px"></div>
    <button class="btn primary" id="again">もう一度(同じモード)</button>
    <button class="btn" id="rshare">結果を共有</button>
    <div id="rmsg" class="sub" style="text-align:center"></div>
    <button class="btn" id="rtitle">タイトルへ</button>
    <div id="rwrong"></div>
  </div>
</section>
<section id="list" class="hidden">
  <div class="card">
    <button class="btn" id="lback">戻る</button>
    <input type="text" id="lq" placeholder="駅名・路線名で絞り込み(空白でAND)" autocomplete="off">
    <select id="lpref"></select>
    <div class="pager"><button class="btn" id="lprev">前へ</button><span id="lcount"></span><button class="btn" id="lnext">次へ</button></div>
    <button class="btn" id="lcopy">絞り込み結果をコピー(TSV)</button>
    <div id="lmsg" class="sub" style="text-align:center"></div>
    <div id="lrows"></div>
    <div class="pager"><button class="btn" id="lprev2">前へ</button><button class="btn" id="lnext2">次へ</button></div>
  </div>
</section>
</main>

  rangeLabel=label;document.querySelectorAll(".modebtn").forEach(b=>b.disabled=!gs.length);
  document.querySelectorAll("#rangeBody .chip[data-p]").forEach(c=>c.classList.toggle("on",selected.has(+c.dataset.p)));
  try{localStorage.setItem(RKEY,JSON.stringify([...selected]))}catch(e){}
}
function setPrefs(ps,on){ps.forEach(p=>{if(ENABLED_PREFS.includes(p)){if(on)selected.add(p);else selected.delete(p)}});refreshRange()}
(function(){
  const body=$("rangeBody");
  const top=document.createElement("div");top.className="rtop";
  [["すべて選ぶ",()=>setPrefs(ENABLED_PREFS,true)],["すべて外す",()=>setPrefs(ENABLED_PREFS,false)]].forEach(([tx,fn])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=tx;b.onclick=fn;top.appendChild(b)});
  body.appendChild(top);
  REGIONS.forEach(([rn,ps])=>{
    const row=document.createElement("div");row.className="rrow";
    const h=document.createElement("button");h.className="chip rname";h.textContent=rn;
    h.onclick=()=>setPrefs(ps,!ps.every(p=>selected.has(p)));row.appendChild(h);
    ps.forEach(p=>{const c=document.createElement("button");c.className="chip";c.dataset.p=p;c.textContent=PREF_NAMES[p].replace(/[都府県]$/,"");
      c.onclick=()=>setPrefs([p],!selected.has(p));row.appendChild(c)});
    body.appendChild(row);
  });
  if(ENABLED_PREFS.length===1)$("range").classList.add("hidden");
  refreshRange();
})();

// ---- 出題 ----
function norm(s){return s.normalize("NFKC").replace(/\s/g,"").replace(/駅$/,"").replace(/[ヶヵ]/g,"ケ")}
function isRight(inp,name){const a=norm(inp);if(!a)return false;
  return a===norm(name)||a===norm(name.replace(/[（(][^）)]*[）)]/g,""))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mkBar(){const b=document.createElement("span");b.className="bar";b.textContent="―";return b}

function drawLines(){
  const h=$("hint"),svg=h.querySelector(".bsvg");if(!svg)return;
  svg.innerHTML="";
  const hr=h.getBoundingClientRect(),q=h.querySelector(".q").getBoundingClientRect();
  h.querySelectorAll(".bcol .st").forEach(b=>{
    const r=b.getBoundingClientRect(),left=b.parentElement.classList.contains("l");
    const v=[(left?r.right:r.left)-hr.left,r.top+r.height/2-hr.top,(left?q.left:q.right)-hr.left,q.top+q.height/2-hr.top];
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ["x1","y1","x2","y2"].forEach((k,i)=>ln.setAttribute(k,v[i]));svg.appendChild(ln)});
}
window.addEventListener("resize",drawLines);
// 隣の駅が1〜2つなら一直線、3つ以上(分岐駅)なら枝分かれの図で表示
function renderHint(el,names){
  el.innerHTML="";
  if(names.length<=2){
    el.className="hint";
    (names.length===1?[names[0],"?"]:[names[0],"?",names[1]]).forEach((n,i)=>{
      if(i)el.appendChild(mkBar());
      const e=document.createElement("span");e.className=n==="?"?"q":"st";e.textContent=n==="?"?"？":n;el.appendChild(e)});
    return;
  }
  el.className="hint branch";
  const h=Math.ceil(names.length/2);
  const col=(arr,side)=>{const c=document.createElement("div");c.className="bcol "+side;
    arr.forEach(n=>{const e=document.createElement("span");e.className="st";e.textContent=n;c.appendChild(e)});return c};
  const q=document.createElement("span");q.className="q";q.textContent="？";
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","bsvg");
  el.append(svg,col(names.slice(0,h),"l"),q,col(names.slice(h),"r"));
  requestAnimationFrame(drawLines);
}
function showPrev(){
  const p=$("prev");
  if(!last){p.className="prev hidden";p.textContent="";return}
  const s=last.name+"駅("+last.line+")";
  p.className="prev "+(last.ok?"ok":"ng");
  p.textContent=last.ok?"前の問題: 正解 ○ "+s
    :(last.passed?"前の問題: パス — 答えは"+s:"前の問題: 不正解 × 答えは"+s+"(あなたの回答: "+last.given+")");
}
function nextQ(){
  if(limit&&asked>=limit){showResult();return}
  if(qi>=queue.length){queue=shuffle(groups);qi=0}
  const g=queue[qi++];cur=DATA.n[g[Math.floor(Math.random()*g.length)]];
  answered=false;
  renderHint($("hint"),shuffle(cur[4]));
  $("lineName").textContent=DATA.l[cur[2]];
  showPrev();
  $("msg").textContent="";$("msg").style.color="";
  $("ans").value="";$("ans").disabled=false;
  $("ansBtns").classList.remove("hidden");$("next").classList.add("hidden");
  $("ans").focus();upd();
}
function upd(){
  const qn=asked+(answered?0:1);
  $("stat").textContent="第"+qn+"問"+(limit?" / "+limit:"");
  $("streak").textContent="正解 "+right+(streak>1?" ・ "+streak+"連続":"")}
function finish(ok,passed,given){
  if(answered)return;answered=true;asked++;
  if(ok){right++;streak++;if(streak>maxStreak)maxStreak=streak}
  else{streak=0;wrongs.push({line:DATA.l[cur[2]],nb:cur[4],name:cur[1],given:given||"",passed})}
  last={ok,passed,given:given||"",name:cur[1],line:DATA.l[cur[2]]};
  $("msg").textContent=(ok?"正解！ ":(passed?"答え：":"不正解。答え："))+cur[1]+"駅";
  $("msg").style.color=ok?"var(--ok)":"var(--ng)";
  $("ans").disabled=true;$("ansBtns").classList.add("hidden");$("next").classList.remove("hidden");
  $("next").textContent=(limit&&asked>=limit)?"結果を見る":"次の問題";
  upd();
}
$("submit").onclick=()=>{const v=$("ans").value;if(!v.trim())return;finish(isRight(v,cur[1]),false,v.trim())};
$("pass").onclick=()=>finish(false,true,"");
// Enterで回答 → 結果を表示。もう一度Enterで次の問題へ(同じキー操作で2つ進まないよう伝播を止める)
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();e.stopPropagation();$("submit").click()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.repeat&&!e.isComposing&&answered&&!$("play").classList.contains("hidden")){e.preventDefault();nextQ()}});
$("next").onclick=nextQ;
function show(id){["start","play","result","list"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function startGame(n){
  groups=currentGroups();if(!groups.length)return;
  limit=n;curMode=n;asked=0;right=0;streak=0;maxStreak=0;wrongs=[];last=null;queue=shuffle(groups);qi=0;
  $("quit").textContent=limit?"やめる":"結果を見る(やめる)";
  show("play");nextQ()}
document.querySelectorAll(".modebtn").forEach(b=>b.onclick=()=>startGame(+b.dataset.n));
function hintText(nb){
  if(nb.length<=2)return (nb.length===1?[nb[0],"？"]:[nb[0],"？",nb[1]]).join(" ― ");
  const h=Math.ceil(nb.length/2),f=a=>a.length>1?"（"+a.join("／")+"）":a[0];
  return f(nb.slice(0,h))+" ⟩ ？ ⟨ "+f(nb.slice(h))+"(分岐)"}
function modeLabel(){return limit?limit+"問モード":"エンドレスモード"}
function showResult(){
  const pct=asked?Math.round(right/asked*100):0;
  $("rmode").textContent=modeLabel()+" ・ 出題範囲: "+rangeLabel;
  $("rscore").textContent=right+" / "+asked;
  $("rrate").textContent="正答率 "+pct+"% ・ 最大連続正解 "+maxStreak;
  $("rcomment").textContent=pct===100?"全問正解！":pct>=80?"お見事！":pct>=50?"まずまず！":"次はもっと当てよう！";
  const w=$("rwrong");w.innerHTML="";
  if(wrongs.length){
    const h=document.createElement("div");h.className="sub";h.style.margin="16px 0 0";h.textContent="まちがえた問題("+wrongs.length+"問)";w.appendChild(h);
    wrongs.forEach(x=>{
      const d=document.createElement("div");d.className="lrow";
      const a=document.createElement("div");a.className="lh";a.textContent=x.line;
      const q=document.createElement("div");q.className="lq";q.textContent=hintText(x.nb);
      const s=document.createElement("div");s.className="la";s.textContent="答え: "+x.name+"駅";
      const g=document.createElement("div");g.className="lh";g.textContent=x.passed?"(パス)":"あなたの回答: "+x.given;
      d.append(a,q,s,g);w.appendChild(d)})}
  $("rmsg").textContent="";
  show("result");window.scrollTo(0,0);
}
$("again").onclick=()=>startGame(curMode);
$("rtitle").onclick=()=>show("start");
$("quit").onclick=()=>{if(!limit&&asked)showResult();else show("start")};
$("rshare").onclick=async()=>{
  const pct=asked?Math.round(right/asked*100):0;
  const text="駅名クイズ "+modeLabel()+" "+right+"/"+asked+"問正解(正答率"+pct+"%)";
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(text);$("rmsg").textContent="結果をコピーしました。"}
  catch(e){$("rmsg").textContent="共有できませんでした。"}
};

// ---- 問題一覧 ----
(function(){
  const rows=DATA.n.filter(r=>ENABLED_PREFS.includes(r[3])).map(r=>({line:DATA.l[r[2]],ans:r[1],nb:r[4],pref:r[3],pn:PREF_NAMES[r[3]]||"",
    key:DATA.l[r[2]]+" "+r[1]+" "+r[4].join(" ")+" "+(PREF_NAMES[r[3]]||"")}));
  const PER=100;let f=rows,page=0;
  $("lpref").innerHTML='<option value="">全都道府県</option>'+Object.entries(PREF_NAMES).filter(([k])=>ENABLED_PREFS.includes(+k)).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join("");
  if(ENABLED_PREFS.length===1)$("lpref").classList.add("hidden");
  function hintStr(nb){
    if(nb.length<=2)return (nb.length===1?[nb[0],"？"]:[nb[0],"？",nb[1]]).join(" ― ");
    const h=Math.ceil(nb.length/2),f=a=>a.length>1?"（"+a.join("／")+"）":a[0];
    return f(nb.slice(0,h))+" ⟩ ？ ⟨ "+f(nb.slice(h))+"(分岐)"}
  function apply(){const terms=$("lq").value.trim().split(/\s+/).filter(Boolean),p=$("lpref").value;
    f=rows.filter(r=>(!p||String(r.pref)===p)&&terms.every(x=>r.key.includes(x)));page=0;draw()}
  function draw(){
    const pages=Math.max(1,Math.ceil(f.length/PER));if(page>=pages)page=pages-1;
    $("lcount").textContent=f.length.toLocaleString()+"件 "+(page+1)+"/"+pages;
    const box=$("lrows");box.innerHTML="";
    f.slice(page*PER,page*PER+PER).forEach(r=>{
      const d=document.createElement("div");d.className="lrow";
      const a=document.createElement("div");a.className="lh";a.textContent=r.line+"・"+r.pn;
      const q=document.createElement("div");q.className="lq";q.textContent=hintStr(r.nb);
      const s=document.createElement("div");s.className="la";s.textContent="答え: "+r.ans;
      d.append(a,q,s);box.appendChild(d)});
  }
  function go(d){page=Math.max(0,page+d);draw();window.scrollTo(0,0)}
  $("dbg").onclick=()=>{$("start").classList.add("hidden");$("list").classList.remove("hidden");apply()};
  $("lback").onclick=()=>{$("list").classList.add("hidden");$("start").classList.remove("hidden")};
  $("lq").addEventListener("input",apply);$("lpref").addEventListener("change",apply);
  $("lprev").onclick=$("lprev2").onclick=()=>go(-1);$("lnext").onclick=$("lnext2").onclick=()=>go(1);
  $("lcopy").onclick=async()=>{
    const tsv=["路線\t都道府県\t隣の駅\t答え",...f.map(r=>[r.line,r.pn,r.nb.join("・"),r.ans].join("\t"))].join("\n");
    try{await navigator.clipboard.writeText(tsv);$("lmsg").textContent=f.length.toLocaleString()+"件をコピーしました。"}
    catch(e){$("lmsg").textContent="コピーできませんでした(ブラウザの制限)。"}
  };
})();
</script>
</body>
